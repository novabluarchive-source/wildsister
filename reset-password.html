<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Access — Wild Sister</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--black:#030303;--card:#0f0f0f;--border:#222;--muted:#666;--white:#f0f0f0;--cyan:#00d4ff;--violet:#7b2fff;--pink:#ff4488}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#030303;color:#888;font-family:'Share Tech Mono',monospace}.box{width:min(420px,100%);border:1px solid var(--border);padding:36px 30px;background:#090909}.tag{font-size:9px;letter-spacing:.3em;color:var(--cyan);text-align:center}.title{font:2.2rem 'VT323';color:var(--white);text-align:center;margin:12px 0 24px}label{display:block;font-size:9px;letter-spacing:.18em;margin:14px 0 7px}input,button{width:100%;padding:13px;font:inherit}input{background:var(--card);border:1px solid var(--border);color:var(--white)}button{margin-top:18px;border:0;background:linear-gradient(135deg,#1e6fff,var(--violet));color:#fff;cursor:pointer}.message{display:none;margin-top:16px;padding:12px;font-size:10px;line-height:1.6}.message.show{display:block}.message.error{color:var(--pink)}.message.success{color:var(--cyan)}
</style>
</head>
<body><main class="box"><div class="tag">// SYMBOL INTELLIGENCE DIVISION</div><div class="title">RESET ACCESS</div><form id="resetForm"><label for="password">// NEW PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">// CONFIRM PASSWORD</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button type="submit">UPDATE PASSWORD →</button></form><div id="message" class="message"></div></main>
<script src="assets/js/supabase-client.js"></script>
<script>
document.getElementById('resetForm').addEventListener('submit',async function(event){
  event.preventDefault();var password=document.getElementById('password').value;var confirmation=document.getElementById('confirmPassword').value;var message=document.getElementById('message');
  if(password!==confirmation){message.className='message show error';message.textContent='Passwords do not match.';return;}
  try{var {error}=await supabaseClient.auth.updateUser({password:password});if(error)throw error;message.className='message show success';message.textContent='Access updated. Returning to sign in…';setTimeout(function(){window.location.href='login.html';},1200);}
  catch(err){message.className='message show error';message.textContent=err.message||'Unable to update password.';}
});
</script></body></html>
